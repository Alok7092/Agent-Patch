app:
  name: "SNAP"
  mode: "local"  # local | azure
  secret_key: "change-me-in-production"
  debug: true

database:
  path: "data/snap.db"

ingestion:
  schedule_cron: "0 9 * * 3"  # Wednesday 9am (day after Patch Tuesday)
  retry_attempts: 3
  retry_backoff_seconds: 5
  sap_api_base_url: ""

claude:
  default_model: "bedrock.anthropic.claude-sonnet-4-5"
  complex_model: "bedrock.anthropic.claude-sonnet-4-5"
  complex_threshold_cvss: 9.0
  max_tokens: 4096
  gate:
    applicable_confidence_threshold: 0.85
    applicable_evidence_threshold: 0.90
    not_applicable_confidence_threshold: 0.95
    not_applicable_evidence_threshold: 0.95
    borderline_margin: 0.10
    enable_verification: true

azure:
  tenant_id: ""
  client_id: ""
  client_secret: ""
