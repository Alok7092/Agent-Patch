{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">Dashboard</h1>
<div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <div class="bg-white p-6 rounded-lg shadow">
        <h2 class="text-lg font-semibold text-gray-600">Security Notes</h2>
        <p class="text-3xl font-bold mt-2">0</p>
        <a href="/notes" class="text-indigo-600 text-sm mt-2 inline-block">View all &rarr;</a>
    </div>
    <div class="bg-white p-6 rounded-lg shadow">
        <h2 class="text-lg font-semibold text-gray-600">Pending Review</h2>
        <p class="text-3xl font-bold mt-2">0</p>
        <a href="/notes?status=matched" class="text-indigo-600 text-sm mt-2 inline-block">Review &rarr;</a>
    </div>
    <div class="bg-white p-6 rounded-lg shadow">
        <h2 class="text-lg font-semibold text-gray-600">Systems</h2>
        <p class="text-3xl font-bold mt-2">0</p>
        <a href="/landscape" class="text-indigo-600 text-sm mt-2 inline-block">Manage &rarr;</a>
    </div>
</div>
{% endblock %}
