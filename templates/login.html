{% extends "base.html" %}
{% block navbar %}{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-20">
    <h1 class="text-3xl font-bold text-center mb-4">SAP Security Note AI Patch</h1>
    <p class="text-center text-gray-500 mb-8">(SNAP)</p>
    <form method="post" action="/login" class="bg-white p-8 rounded-lg shadow">
        {% if error %}
        <div class="bg-red-100 text-red-700 p-3 rounded mb-4">{{ error }}</div>
        {% endif %}
        <div class="mb-4">
            <label class="block text-sm font-medium mb-1">Username</label>
            <input type="text" name="username" required class="w-full border rounded p-2">
        </div>
        <div class="mb-6">
            <label class="block text-sm font-medium mb-1">Password</label>
            <input type="password" name="password" required class="w-full border rounded p-2">
        </div>
        <button type="submit" class="w-full bg-indigo-600 text-white p-3 rounded font-medium hover:bg-indigo-700">
            Sign In
        </button>
    </form>
</div>
{% endblock %}
